<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>arXiv Venue &amp; CCF</title>
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; color: #b31b1b; }
    .row { display: flex; gap: 6px; margin: 6px 0; align-items: baseline; }
    label { flex: 0 0 64px; color: #555; }
    input[type="text"] { flex: 1; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 4px 12px; border: 1px solid #b31b1b; background: #fff; color: #b31b1b;
             border-radius: 4px; cursor: pointer; }
    button:hover { background: #b31b1b; color: #fff; }
    .a { background: #b31b1b; } .b { background: #d97706; } .c { background: #4b5563; }
    .err { color: #b31b1b; }
    .muted { color: #888; font-size: 11px; margin-top: 8px; }
    pre { background: #f4f2ee; padding: 8px; border-radius: 4px; font-size: 11px;
          white-space: pre-wrap; word-break: break-all; }
    details { margin-top: 6px; }
  </style>
</head>
<body>
  <h1>arXiv Venue &amp; CCF</h1>
  <div class="row">
    <label for="aid">arXiv ID</label>
    <input type="text" id="aid" placeholder="2407.01489 或完整网址">
  </div>
  <div class="row">
    <button id="go">解析</button>
    <span id="status"></span>
  </div>
  <div class="row">
    <label for="s2key">S2 Key</label>
    <input type="text" id="s2key" placeholder="可选，绕过公共限流" size="12">
  </div>
  <div class="row">
    <button id="savekey">保存 Key</button>
    <span id="keystatus" class="muted"></span>
  </div>
  <div class="out" id="out"></div>
  <div class="muted">当前标签页是 arXiv abs 页时自动填充。</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
